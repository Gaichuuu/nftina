# metazoonfts.com - static, fully prerendered site
#

# Redirect www to non-www (301 permanent)
if ($host = www.metazoonfts.com) {
    return 301 https://metazoonfts.com$request_uri;
}

# Serve the site's prerendered 404 page (dist/404.html) instead of nginx's default
error_page 404 /404.html;

# Compress the text assets: the runtime JSON (holders/tokens files run to
# hundreds of KB)
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/xml;

# Cache static assets
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /data/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

# Models are multi-MB and change only with a deploy
location /sandbox3d/ {
    add_header Cache-Control "public, max-age=604800" always;
}

# Catch-all
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
