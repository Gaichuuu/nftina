# metazoonfts.com - static, fully prerendered site
#

# Redirect www to non-www (301 permanent)
if ($host = www.metazoonfts.com) {
    return 301 https://metazoonfts.com$request_uri;
}

# Cache static assets
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /data/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

# Models are multi-MB and change only with a deploy
location /sandbox3d/ {
    add_header Cache-Control "public, max-age=604800" always;
}

# Catch-all
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
