# metazoonfts.com - static, fully prerendered site
#

# Redirect www to non-www (301 permanent)
if ($host = www.metazoonfts.com) {
    return 301 https://metazoonfts.com$request_uri;
}

# Force https (301)
if ($scheme = http) {
    return 301 https://metazoonfts.com$request_uri;
}

# Fingerprinted build output
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Pipeline data and 3D models change under fixed names, so they revalidate
location /data/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

location /sandbox3d/ {
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
}

# catch-all: every route is prerendered
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
